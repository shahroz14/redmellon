ingest:
  accounts:
    - broker: ZERODHA  # or ANGELONE
      user-id: YOUR_ZERODHA_CLIENT_ID     # e.g. AB1234
      password: YOUR_ZERODHA_PASSWORD
      totp-secret: YOUR_TOTP_SECRET_KEY   # base32 seed from authenticator app setup
      apps:
        - api-key: YOUR_KITE_API_KEY_1
          api-secret: YOUR_KITE_API_SECRET_1
        - api-key: YOUR_KITE_API_KEY_2
          api-secret: YOUR_KITE_API_SECRET_2
    - user-id: YOUR_ZERODHA_CLIENT_ID_2
      password: YOUR_ZERODHA_PASSWORD_2
      totp-secret: YOUR_TOTP_SECRET_KEY_2
      apps:
        - api-key: YOUR_KITE_API_KEY_1
          api-secret: YOUR_KITE_API_SECRET_1
