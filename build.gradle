plugins {
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

allprojects {
    group = 'com.redmellon'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'scala'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        implementation "org.scala-lang:scala-library:${scalaFullVersion}"

        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    spotless {
        scala {
            scalafmt('3.8.3').configFile(rootProject.file('.scalafmt.conf'))
        }
    }
}

tasks.register('installGitHooks') {
    doLast {
        def hook = new File(rootProject.projectDir, '.git/hooks/pre-commit')
        hook.parentFile.mkdirs()
        hook.text = '''\
#!/bin/sh
./gradlew spotlessCheck --daemon -q
if [ $? -ne 0 ]; then
  echo "Formatting check failed. Run ./gradlew spotlessApply to fix."
  exit 1
fi
'''
        hook.setExecutable(true)
        println "Pre-commit hook installed."
    }
}
