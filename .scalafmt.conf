version = 3.8.3
runner.dialect = scala213

maxColumn = 120

align.preset = more
align.multiline = false
align.tokens."+" = [
  { code = "=", owner = "Defn.Def" }
]

indent.defnSite = 2
indent.callSite = 2

newlines.source = keep

rewrite.rules = [RedundantBraces]
rewrite.redundantBraces.stringInterpolation = true
